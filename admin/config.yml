# Sveltia CMS configuration for /admin (guide: docs/ADMIN.md).
# Texts: the Markdown files in docs/, edited as plain text so nothing gets reformatted.
# Photos: one JSON file per page in content/foto/. After every save, the GitHub Action
# "Update site" turns uploads into img/<page>/cover.jpg, 01.jpg ... and rebuilds the HTML.

backend:
  name: github
  repo: simonecarduccii/portfolio
  branch: main
  commit_messages:
    create: "Add {{slug}} from admin"
    update: "Update {{slug}} from admin"
    delete: "Delete {{slug}} from admin"
    uploadMedia: "Upload {{path}} from admin"
    deleteMedia: "Delete {{path}} from admin"

site_url: https://bohememag.it/portfolio/
display_url: https://bohememag.it/portfolio/

media_folder: content/caricate
public_folder: /content/caricate

media_libraries:
  default:
    config:
      slugify_filename: true
      # Big photos are shrunk in the browser before upload; the Action then makes the final JPEG.
      transformations:
        raster_image:
          format: webp
          quality: 92
          width: 2600
          height: 2600

editor:
  preview: false

collections:
  - name: testi
    label: Testi
    label_singular: Testo
    icon: edit_note
    description: >-
      I testi delle pagine. Cambia solo le parole: lascia uguali i titoli che iniziano con ##
      e le etichette tra **asterischi**, perché il sito li usa per sapere dove va ogni testo.
      Dopo il salvataggio il sito si aggiorna da solo in 1-2 minuti.
    format: raw
    files:
      - name: contenuti
        label: "Testi generali (home, about, archivio, AI)"
        file: docs/CONTENUTI.md
        fields:
          - name: body
            label: Testo
            widget: text
            hint: "**grassetto**, _corsivo_, [testo del link](https://...). Le frasi con [DA VERIFICARE] restano evidenziate sul sito finché non togli la nota."
      - name: boheme-magazine
