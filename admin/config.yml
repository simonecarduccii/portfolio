            required: false
            hint: "Percorso dentro porfolio/information_architecture sul Mac, es. 01home/03ricerca_visiva/01faccini. Se la imposti, il Mac aggiorna il sito ogni volta che cambi un file nella cartella (serve la sincronizzazione installata, vedi guida). Lascia vuoto per usare solo le foto caricate qui."
